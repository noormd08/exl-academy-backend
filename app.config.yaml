application:
  actions: actions
  runtimeManifest:
    packages:
      premium-learning:
        license: Apache-2.0
        actions:
          generic:
            function: actions/generic/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: false
              final: true
          learner-context:
            function: actions/learner-context/index.js
            web: 'no'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: false
              final: true
          retrieval:
            function: actions/retrieval/index.js
            web: 'no'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: false
              final: true
          compose-plan:
            function: actions/compose-plan/index.js
            web: 'yes'
            runtime: nodejs:22
            # Public but data-disabled until a browser-safe access-control mechanism is configured.
            inputs:
              LOG_LEVEL: debug
              CORS_ORIGIN: $CORS_ORIGIN
            annotations:
              require-adobe-auth: false
              final: true
